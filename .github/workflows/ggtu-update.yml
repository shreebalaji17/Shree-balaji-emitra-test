name: GGTU Latest Notifications Update

on:
  schedule:
    # हर 6 घंटे में चलेगा
    - cron: "0 */6 * * *"

  # GitHub से manually भी चला सकेंगे
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-ggtu:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Fetch GGTU Latest Updates
        run: |
          python <<'PY'
          import requests
          from bs4 import BeautifulSoup
          import json
          from datetime import datetime, timezone, timedelta
          from urllib.parse import urljoin

          URL = "https://www.ggtu.ac.in/"
          OUTPUT = "ggtu-notices.json"

          headers = {
              "User-Agent":
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 Chrome/131 Safari/537.36"
          }

          try:
              response = requests.get(
                  URL,
                  headers=headers,
                  timeout=30
              )

              response.raise_for_status()

              soup = BeautifulSoup(
                  response.text,
                  "html.parser"
              )

          except Exception as e:
              print("GGTU website fetch error:", e)
              raise

          notices = []

          # सभी links खोजें
          for a in soup.find_all("a", href=True):

              title = a.get_text(
                  " ",
                  strip=True
              )

              href = a.get("href", "").strip()

              if not title:
                  continue

              # Relative URL को full URL बनाना
              link = urljoin(URL, href)

              title_lower = title.lower()

              # केवल विद्यार्थी / परीक्षा संबंधित notices
              keywords = [
                  "notification",
                  "time table",
                  "timetable",
                  "exam",
                  "examination",
                  "semester",
                  "result",
                  "admit",
                  "revaluation",
                  "due",
                  "supplementary",
                  "back",
                  "fee",
                  "marksheet",
                  "ug",
                  "pg",
                  "b.tech",
                  "b.ed",
                  "llb",
                  "llm"
              ]

              important = any(
                  keyword in title_lower
                  for keyword in keywords
              )

              if not important:
                  continue

              # GGTU के official documents को प्राथमिकता
              if "ggtu.ac.in" not in link.lower():
                  continue

              # PDF/document links को प्राथमिकता
              if not (
                  ".pdf" in link.lower()
                  or "ggtu.ac.in" in link.lower()
              ):
                  continue

              # Duplicate रोकें
              exists = any(
                  n["title"] == title
                  and n["url"] == link
                  for n in notices
              )

              if exists:
                  continue

              notices.append({
                  "title": title,
                  "url": link,
                  "date": datetime.now(
                      timezone(
                          timedelta(hours=5, minutes=30)
                      )
                  ).strftime("%d-%m-%Y")
              })

          # सबसे पहले मिलने वाले latest notices
          notices = notices[:30]

          data = {
              "source": URL,
              "updated": datetime.now(
                  timezone(
                      timedelta(hours=5, minutes=30)
                  )
              ).strftime("%d-%m-%Y %I:%M %p"),
              "notices": notices
          }

          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              f"Total GGTU notices found: {len(notices)}"
          )
          PY

      - name: Commit updated notices
        run: |
          git config user.name "GGTU Auto Update"
          git config user.email "actions@github.com"

          git add ggtu-notices.json

          git diff --cached --quiet || \
          git commit -m "Auto update GGTU notifications"

          git push
